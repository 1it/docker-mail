networks:
    mail:
        name: mail_network

volumes:
    ssl:
    mail:
    spool:

services:
  certs:
    build: certs
    restart: "no"
    volumes:
      - "ssl:/etc/ssl"
    healthcheck:
      test: ["CMD", "test", "-f", "/etc/ssl/certs/mail.crt"]
      interval: 30s
      timeout: 10s
      retries: 3
    env_file: docker-compose.env

  dovecot:
    build: dovecot
    restart: unless-stopped
    ports:
      - "110:110"
      - "143:143"
      - "993:993"
      - "995:995"
    volumes:
      - "mail:/var/mail"
      - "ssl:/etc/ssl"
    networks:
      - mail
    depends_on:
      certs:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "test", "-f", "/var/run/dovecot/master.pid"]
      interval: 30s
      timeout: 10s
      retries: 3
    env_file: docker-compose.env

  postfix:
    build: postfix
    restart: unless-stopped
    ports:
      - "25:25"
      - "465:465"
      - "587:587"
    volumes:
      - "mail:/var/mail"
      - "spool:/var/spool/postfix"
      - "ssl:/etc/ssl"
    networks:
      - mail
    depends_on:
      dovecot:
        condition: service_healthy
      certs:
        condition: service_completed_successfully
    env_file: docker-compose.env

  postfixadmin:
    build: postfixadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - "mail:/var/mail"
    networks:
      - mail
    depends_on:
      certs:
        condition: service_completed_successfully
    env_file: docker-compose.env

  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped
    networks:
      - mail
    healthcheck:
      test: ["CMD", "clamdscan", "--ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  spamassassin:
    build: spamassassin
    restart: unless-stopped
    networks:
      - mail
    healthcheck:
      test: ["CMD", "spamassassin", "--lint"]
      interval: 30s
      timeout: 10s
      retries: 3
    env_file: docker-compose.env
